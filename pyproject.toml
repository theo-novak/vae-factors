[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vae-factors"
version = "0.1.0"
description = "A variational autoencoder factor model for equity return covariances"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "plotly>=5.18",
    "streamlit>=1.30",
    "duckdb>=0.10",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.7",
    "yfinance>=0.2.37",
    "pandas-datareader>=0.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1", "pytest-cov"]

[project.scripts]
vae = "vae_factors.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vae_factors"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
